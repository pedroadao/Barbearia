services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - barbearia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - barbearia_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # host.docker.internal porque o Authentication roda em outro docker-compose
      # (outro container); "localhost" de dentro deste container seria ele mesmo.
      Authentication__Authority: "https://host.docker.internal:8443/"
      Authentication__Audience: "authentication-api"
      # Diferente de Authority: é a URL pela qual o navegador acessa o Authentication
      # e que por isso fica no "iss" dos tokens emitidos.
      Authentication__Issuer: "https://localhost:8443/"
      RabbitMq__HostName: "rabbitmq"
      WhatsApp__PhoneNumberId: "${WHATSAPP_PHONE_NUMBER_ID}"
      WhatsApp__AccessToken: "${WHATSAPP_ACCESS_TOKEN}"
    ports:
      - "${API_PORT}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ../BarbeariaReact
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${API_PORT}"
        # Authentication deve estar rodando via seu próprio docker-compose (porta
        # https publicada 8443). O fluxo OAuth é navegação completa do browser do
        # host, não container-para-container, por isso localhost e não o nome do
        # serviço Docker.
        VITE_AUTH_BASE_URL: "https://localhost:8443"
        VITE_OIDC_CLIENT_ID: "barbearia-spa-client"
        VITE_OIDC_REDIRECT_URI: "http://localhost:${WEB_PORT}/callback"
        VITE_OIDC_SCOPE: "openid email profile offline_access"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"

volumes:
  barbearia_postgres_data:
  barbearia_rabbitmq_data:
